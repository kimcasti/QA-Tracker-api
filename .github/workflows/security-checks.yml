name: Security unit checks

on:
  pull_request:
  push:
    branches: [main, master, 'security/**']

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_SECURITY_SCRATCH: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
